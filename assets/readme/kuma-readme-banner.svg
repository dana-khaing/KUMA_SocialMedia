<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KUMA Social homepage inspired README banner</title>
  <desc id="desc">A bright banner inspired by the KUMA Social homepage, with orange navigation, profile card, story composer, post box, and student social panels.</desc>
  <defs>
