    </linearGradient>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.68" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>

