    <rect x="842" y="212" width="94" height="12" rx="6" fill="#111827" fill-opacity="0.7"/>
    <rect x="842" y="238" width="74" height="8" rx="4" fill="#94A3B8"/>
    <rect x="842" y="260" width="88" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="842" y="282" width="70" height="18" rx="9" fill="#FF6A3A"/>
  </g>

  <g filter="url(#softShadow)">
