    <circle cx="1022" cy="220" r="17" fill="#FF4E01"/>
    <rect x="1054" y="208" width="56" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.92"/>
    <rect x="1054" y="230" width="68" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="1018" y="265" width="90" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.13"/>
    <circle cx="1034" cy="279" r="6" fill="#22C55E"/>
    <rect x="1050" y="274" width="40" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="866" y="326" width="224" height="38" rx="19" fill="#111827"/>
    <circle cx="892" cy="345" r="7" fill="#22C55E"/>
    <text x="910" y="351" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" letter-spacing="0">Realtime notifications</text>
