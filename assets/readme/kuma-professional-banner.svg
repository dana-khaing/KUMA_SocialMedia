    <text x="130" y="20" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="0">v0.1-beta</text>
    <rect x="242" y="0" width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="262" y="20" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="0">Netlify Deploy</text>
  </g>

