<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KUMA Social professional README banner</title>
  <desc id="desc">A professional KUMA Social banner with strong contrast, KUMA logo mark, and product UI preview cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.48" stop-color="#172033"/>
      <stop offset="1" stop-color="#FB5428"/>
    </linearGradient>
    <linearGradient id="warmPanel" x1="742" y1="78" x2="1188" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FFE7DC"/>
    </linearGradient>
    <linearGradient id="darkGlass" x1="80" y1="120" x2="744" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.74"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="34" fill="url(#bg)"/>
  <path d="M0 314C170 268 338 280 512 319C688 358 835 374 1018 321C1126 290 1210 277 1280 286V420H0V314Z" fill="#020617" fill-opacity="0.28"/>
  <path d="M795 0H1280V420H1018C934 338 888 251 866 150C855 98 830 44 795 0Z" fill="#FF7A45" fill-opacity="0.2"/>
  <path d="M937 0H1280V420H1146C1066 340 1016 250 991 151C976 92 958 42 937 0Z" fill="#FFFFFF" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="72" y="64" width="682" height="292" rx="30" fill="url(#darkGlass)"/>
    <rect x="73" y="65" width="680" height="290" rx="29" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <g transform="translate(112 104)">
    <rect x="0" y="0" width="104" height="104" rx="28" fill="#FFF7ED"/>
    <path d="M28 72V28L49 50L73 29" stroke="#FF4E01" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M77 72V41H91C100 41 107 48 107 57C107 66 100 73 91 73H77" transform="translate(-10 -1)" stroke="#FF4E01" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 73C42 90 67 90 82 73" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="112" y="252" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="850" letter-spacing="0">KUMA Social</text>
  <text x="116" y="304" fill="#FFF7ED" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0">Student-focused social media for RHUL</text>
  <text x="116" y="342" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="520" letter-spacing="0">Profiles, posts, stories, follows, comments, and realtime activity.</text>

  <g transform="translate(112 374)">
    <rect x="0" y="0" width="96" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.14"/>
    <circle cx="20" cy="14" r="6" fill="#22C55E"/>
    <text x="34" y="20" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="0">Live Beta</text>
