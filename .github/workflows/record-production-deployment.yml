name: Record production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  record-production-deployment:
    name: Record Netlify production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              description: "KUMA production deploy on Netlify",
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });

            core.setOutput("deployment_id", deployment.id);

      - name: Mark deployment successful
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_URL: https://kuma-social-media.netlify.app
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment: "production",
              environment_url: process.env.DEPLOYMENT_URL,
              log_url: process.env.DEPLOYMENT_URL,
              description: "Production is live on Netlify",
            });
